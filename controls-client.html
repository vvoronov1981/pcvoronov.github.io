<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controls API Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .info-box {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .info-box h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .info-box code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .control-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .control-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .control-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .control-type {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            margin-bottom: 10px;
        }

        .control-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
        }

        .status-indicator.inactive {
            background: #9e9e9e;
        }

        .control-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin: 15px 0;
        }

        .control-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 20px;
        }

        .refresh-btn {
            display: block;
            width: 200px;
            margin: 0 auto 20px;
            padding: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎛️ Controls Management System</h1>
        
        <div class="info-box">
            <h2>📡 API Connection</h2>
            <p><strong>Server:</strong> <code>http://localhost:5001</code></p>
            <p><strong>API Key:</strong> <code>shark</code></p>
            <p><strong>Status:</strong> <span id="connection-status">Checking...</span></p>
        </div>

        <div class="error-message" id="error-message"></div>

        <button class="refresh-btn" onclick="loadControls()">🔄 Refresh Controls</button>

        <div id="loading" class="loading">Loading controls...</div>
        <div id="controls-container" class="controls-grid"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001';
        const API_KEY = 'shark';

        async function checkConnection() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                
                if (data.status === 'ok') {
                    document.getElementById('connection-status').textContent = '✅ Connected';
                    document.getElementById('connection-status').style.color = '#4caf50';
                    return true;
                }
            } catch (error) {
                document.getElementById('connection-status').textContent = '❌ Disconnected';
                document.getElementById('connection-status').style.color = '#c62828';
                showError('Cannot connect to server. Make sure the server is running on port 5001.');
                return false;
            }
        }

        async function loadControls() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('controls-container').innerHTML = '';
            hideError();

            try {
                const response = await fetch(`${API_URL}/controls`, {
                    headers: {
                        'X-Api-Key': API_KEY
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                document.getElementById('loading').style.display = 'none';

                if (result.success && result.data) {
                    displayControls(result.data);
                } else {
                    showError('Failed to load controls');
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showError(`Error loading controls: ${error.message}`);
            }
        }

        function displayControls(controls) {
            const container = document.getElementById('controls-container');
            container.innerHTML = '';

            controls.forEach(control => {
                const card = document.createElement('div');
                card.className = 'control-card';
                
                const statusClass = control.status === 'active' ? '' : 'inactive';
                const unitDisplay = control.unit ? ` ${control.unit}` : '';
                
                card.innerHTML = `
                    <h3>${control.name}</h3>
                    <span class="control-type">${control.type}</span>
                    <div class="control-status">
                        <span class="status-indicator ${statusClass}"></span>
                        <span>${control.status}</span>
                    </div>
                    <div class="control-value">${control.value}${unitDisplay}</div>
                    <div class="control-actions">
                        <button onclick="performAction(${control.id}, 'read')">📖 Read</button>
                        ${getActionButton(control)}
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        function getActionButton(control) {
            switch (control.type) {
                case 'switch':
                    const newValue = control.value === 'on' ? 'off' : 'on';
                    return `<button onclick="performAction(${control.id}, 'toggle', '${newValue}')">🔄 Toggle</button>`;
                case 'lock':
                    const lockValue = control.value === 'locked' ? 'unlocked' : 'locked';
                    return `<button onclick="performAction(${control.id}, 'toggle', '${lockValue}')">🔓 ${control.value === 'locked' ? 'Unlock' : 'Lock'}</button>`;
                case 'controller':
                    return `<button onclick="performAction(${control.id}, 'start', 1000)">▶️ Start</button>`;
                default:
                    return `<button onclick="performAction(${control.id}, 'refresh')">🔄 Refresh</button>`;
            }
        }

        async function performAction(controlId, action, value = null) {
            hideError();
            
            try {
                const body = { action };
                if (value !== null) {
                    body.value = value;
                }

                const response = await fetch(`${API_URL}/controls/${controlId}/action`, {
                    method: 'POST',
                    headers: {
                        'X-Api-Key': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                const result = await response.json();
                
                if (result.success) {
                    // Reload controls to show updated state
                    await loadControls();
                } else {
                    showError(`Action failed: ${result.error || 'Unknown error'}`);
                }
            } catch (error) {
                showError(`Error performing action: ${error.message}`);
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }

        // Initialize
        async function init() {
            const connected = await checkConnection();
            if (connected) {
                await loadControls();
            }
        }

        init();
    </script>
</body>
</html>
