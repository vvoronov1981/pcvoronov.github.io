name: StockTradingBot CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'StockTradingBot/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'StockTradingBot/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    name: Build StockTradingBot
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install FreePascal Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc libssl-dev
      
      - name: Build StockTradingBot
        run: |
          cd StockTradingBot
          fpc -O3 -XX -CX StockTradingBot.dpr
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockTradingBot-linux
          path: StockTradingBot/StockTradingBot
          retention-days: 7

