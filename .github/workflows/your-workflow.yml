name: Use GitHub Secrets

on:
  push:
    branches:
      - main

jobs:
  use-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Run script with secret
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          echo "Your API token is available as $API_TOKEN"
          node script.js
