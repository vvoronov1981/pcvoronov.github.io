<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PC Voronov — IT-послуги, мережі, сервери та розробка ПЗ</title>
  <meta name="description" content="PC Voronov — IT-послуги для бізнесу та приватних клієнтів: мережі, сервери, обладнання, програмна розробка, консалтинг." />
</head>
<body>
  <section id="contacts">
    <h2>Оплата LiqPay</h2>

    <div class="ki-qr-block">
      <p class="ki-qr-hint">📱 QR-Code mit Privat24 oder LiqPay scannen:</p>

      <a href="#" target="_blank" rel="noopener" id="ki-qr-link" style="display:none;">
        <img id="ki-qr-img" src="" alt="LiqPay QR-Code bezahlen" class="ki-qr-img" />
      </a>

      <button class="ki-pay-btn ki-liqpay-btn" id="ki-pay-btn" type="button">
        💳 Auf Handy öffnen &amp; bezahlen
      </button>

      <p class="ki-pay-note">Nach Zahlung auf <strong style="color:#38bdf8">„Chat starten"</strong> klicken ↓</p>

      <button class="ki-pay-btn" id="ki-paid-confirm-btn"
              style="background:rgba(255,255,255,.08);margin-top:.4rem;font-size:.85rem;" type="button">
        ✅ Ich habe bezahlt – Chat starten
      </button>

      <p id="ki-pay-status" style="margin-top:.6rem;font-size:.85rem;color:#94a3b8;"></p>
    </div>
  </section>

  <script>
    // IMPORTANT:
    // This GitHub Pages site is static. Real LiqPay requires backend endpoint that signs request.
    // Set your deployed backend endpoint here:
    const LIQPAY_CREATE_ENDPOINT = 'https://your-api.example.com/api/liqpay/create';

    const payBtn = document.getElementById('ki-pay-btn');
    const qrLink = document.getElementById('ki-qr-link');
    const qrImg = document.getElementById('ki-qr-img');
    const statusEl = document.getElementById('ki-pay-status');

    async function createLiqPayCheckout() {
      const payload = {
        amount: 410,
        currency: 'UAH',
        description: 'KI-Unterstützung (AI Chat, 30 Min)'
      };

      const res = await fetch(LIQPAY_CREATE_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data?.error || 'Payment init failed');
      if (!data.checkout_url) throw new Error('checkout_url missing in API response');
      return data.checkout_url;
    }

    payBtn?.addEventListener('click', async () => {
      try {
        payBtn.disabled = true;
        statusEl.textContent = 'Erstelle sichere LiqPay-Zahlung...';

        const checkoutUrl = await createLiqPayCheckout();

        // Open payment page in new tab
        window.open(checkoutUrl, '_blank', 'noopener');

        // Build dynamic QR for the created checkout URL
        const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&color=0f172a&bgcolor=e2e8f0&data=' + encodeURIComponent(checkoutUrl);
        qrImg.src = qrSrc;
        qrLink.href = checkoutUrl;
        qrLink.style.display = 'inline-block';

        statusEl.textContent = 'Zahlungslink erstellt. Öffnen Sie den Link oder scannen Sie den QR-Code.';
      } catch (e) {
        statusEl.textContent = 'Fehler: ' + (e?.message || 'Unbekannter Fehler');
      } finally {
        payBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
