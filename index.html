<!DOCTYPE html>
<html lang="en">
  <head>
    	
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="./styles.css" />	 
  </head>
  <body>
    <header>
      <h1 class="title">Products</h1>
    </header>
    <main>
      <button id="cart-btn" type="button" class="btn">
        <span id="show-hide-cart">Show</span> Cart
      </button>
      <button id="add-btn" type="button" class="btn" onclick="location.href='./nz.html'">
        <span>Add</span> product</button>
      <div id="cart-container">
        <button class="btn" id="clear-cart-btn">Clear Cart</button>
        <div id="products-container"></div>
        <p>Total number of items: <span id="total-items">0</span></p>
        <p>Subtotal: <span id="subtotal">$0</span></p>
        <p>Taxes: <span id="taxes">$0</span></p>
        <p>Total: <span id="total">$0</span></p>
	
<form action="https://www.paypal.com/cgi-bin/webscr" method="post">
    <input type="hidden" name="cmd" value="_xclick">
    <input type="hidden" name="business" value="comprw@gmail.com">
    <input type="hidden" name="item_name" id="item_name" value="Название товара">
    <input type="hidden" name="amount" id="amount" value="5.95">
    <input type="hidden" name="currency_code" value="USD">
    <input type="image" name="submit" src="https://www.paypalobjects.com/en_US/i/btn/btn_buynow_LG.gif" alt="Buy Now">
</form>
	
      </div>
      <div id="painting-card-container"></div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
